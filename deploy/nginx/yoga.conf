# 瑜伽卖课小程序 · Nginx 反向代理示例
# 放置：/etc/nginx/conf.d/yoga.conf，改掉域名与证书路径后 nginx -t && systemctl reload nginx
#
# 前置：
#   1) 域名已完成 ICP 备案（国内服务器必须），A 记录指向本机
#   2) 证书：certbot --nginx -d yoga.example.com   或自有证书
#   3) 后端只监听 127.0.0.1:3100（默认即如此）

upstream yoga_backend {
    server 127.0.0.1:3100;
    keepalive 32;
}

# HTTP 全量跳 HTTPS（微信小程序只允许 https）
server {
    listen 80;
    listen [::]:80;
    server_name yoga.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yoga.example.com;

    ssl_certificate     /etc/letsencrypt/live/yoga.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yoga.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 4m;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 微信支付回调：不要缓存、不要改 body、保序（验签依赖原始字节）
    location = /api/payment/wxpay/notify {
        proxy_pass http://yoga_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering on;
        proxy_buffering off;
    }

    # 静态资源：H5 前台 + 后台
    location ~* ^/(app\.js|admin\.js|style\.css|admin\.css)$ {
        proxy_pass http://yoga_backend;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 封面图（后端生成的 SVG）：可缓存，但时间别太长，便于换图
    location ^~ /api/media/ {
        proxy_pass http://yoga_backend;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # 其余全部走应用（含 /api/* 与 SPA 路由）
    location / {
        proxy_pass http://yoga_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    access_log /var/log/nginx/yoga.access.log;
    error_log  /var/log/nginx/yoga.error.log warn;
}
